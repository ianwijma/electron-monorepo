<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="80 64 384 384">
  <title>Qlippy tray</title>
  <desc>The Qlippy clipboard on its own, outlined so it stays visible on light and dark panels.</desc>
  <!-- outline -->
  <rect x="132" y="112" width="248" height="284" rx="96" fill="none" stroke="#1E1B4B" stroke-width="28"/>
  <path d="M310 372 Q350 414 412 404" fill="none" stroke="#1E1B4B" stroke-width="72" stroke-linecap="round"/>
  <!-- board + Q tail -->
  <rect x="132" y="112" width="248" height="284" rx="96" fill="#F8FAFC"/>
  <path d="M310 372 Q350 414 412 404" fill="none" stroke="#F8FAFC" stroke-width="44" stroke-linecap="round"/>
  <!-- clip -->
  <rect x="190" y="78" width="132" height="72" rx="26" fill="#1E1B4B"/>
  <rect x="232" y="100" width="48" height="14" rx="7" fill="#A78BFA"/>
  <!-- clipboard history -->
  <rect x="180" y="196" width="152" height="56" rx="16" fill="#7C3AED"/>
  <rect x="198" y="216" width="88" height="16" rx="8" fill="#F5F3FF"/>
  <rect x="188" y="280" width="128" height="16" rx="8" fill="#A5B4FC"/>
  <rect x="200" y="320" width="92" height="16" rx="8" fill="#A5B4FC"/>
</svg>
