<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none">
  <title>Electron Monorepo</title>
  <desc>A grid of workspace modules circled by an orbit: many packages, one repo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- workspace modules -->
  <rect x="15" y="15" width="15.5" height="15.5" rx="3.5" fill="#38BDF8"/>
  <rect x="33.5" y="15" width="15.5" height="15.5" rx="3.5" fill="#818CF8"/>
  <rect x="15" y="33.5" width="15.5" height="15.5" rx="3.5" fill="#2DD4BF"/>
  <rect x="33.5" y="33.5" width="15.5" height="15.5" rx="3.5" fill="#E2E8F0"/>
  <!-- orbit -->
  <ellipse cx="32" cy="32" rx="27" ry="8.5" transform="rotate(-35 32 32)" stroke="#0B1220" stroke-width="4.5"/>
  <ellipse cx="32" cy="32" rx="27" ry="8.5" transform="rotate(-35 32 32)" stroke="#F8FAFC" stroke-width="2"/>
  <circle cx="54.1" cy="16.5" r="3.4" fill="#F8FAFC" stroke="#0B1220" stroke-width="2"/>
</svg>
